# Coloca este archivo en la raíz del repositorio, junto a bautismo-api/.
services:
  - type: web
    name: bautisacrum-api
    runtime: docker
    plan: free
    dockerfilePath: ./bautismo-api/Dockerfile
    dockerContext: ./bautismo-api
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Conexión de Neon: se introduce en Render, nunca en el repositorio.
      - key: DATABASE_URL
        sync: false
      # Arreglo JSON de hashes SHA-256 generados con npm run device-token.
      - key: SYNC_API_TOKEN_HASHES
        sync: false
